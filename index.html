<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voice to Text - ভয়েস টাইপিং</title>

<link rel="icon" type="image/jpg" href="https://i.pinimg.com/736x/70/1a/f4/701af4536876f6acf9d9bc853921db87.jpg">
<link rel="apple-touch-icon" href="https://i.pinimg.com/736x/70/1a/f4/701af4536876f6acf9d9bc853921db87.jpg">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Orbitron:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg-primary: #ffffff;
  --bg-secondary: #ffffff;
  --text-primary: #111111;
  --text-secondary: #333333;
  --glass-bg: #ffffff;
  --glass-border: #111111;
  --glass-shadow: rgba(0,0,0,.08);
  --accent: #00a8cc;
  --accent-secondary: #6550d8;
  --accent-glow: rgba(0,168,204,.22);
  --mic-glow: rgba(0,168,204,.25);
  --copy-bg: rgba(0,0,0,.06);
  --copy-border: #111111;
  --clear-bg: rgba(0,0,0,.04);
  --clear-border: #111111;
  --clear-color: #111111;
  --font-family: 'Hind Siliguri','Noto Sans Bengali',sans-serif;
  --transition-speed: .25s;
}

html.dark-mode {
  --bg-primary: #050a15;
  --bg-secondary: #0a1628;
  --text-primary: #e8f4ff;
  --text-secondary: #a9c0dc;
  --glass-bg: rgba(10,22,40,.96);
  --glass-border: rgba(150,190,230,.28);
  --glass-shadow: rgba(0,0,0,.38);
  --accent: #00d4ff;
  --accent-secondary: #7b5cff;
  --accent-glow: rgba(0,212,255,.25);
  --mic-glow: rgba(0,212,255,.28);
  --copy-bg: rgba(0,212,255,.12);
  --copy-border: rgba(0,212,255,.5);
  --clear-bg: rgba(255,75,100,.12);
  --clear-border: rgba(255,75,100,.5);
  --clear-color: #ff7184;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body, body * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.text-display {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.text-display.editable {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}

body {
  font-family: var(--font-family);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background var(--transition-speed),color var(--transition-speed);
  position: relative;
}

.bg-animation-container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: transparent; /* পুরোনো কালার সরানো হলো */
}

/* ব্যাকগ্রাউন্ড ইমেজ এবং হালকা ব্লার ইফেক্ট শুধু এখানেই প্রয়োগ হবে */
.bg-animation-container::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url('https://i.pinimg.com/736x/f7/ec/b9/f7ecb95038cd92fcf7854848c99a219f.jpg'); /* Laptop Light Mode */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  filter: blur(3px); /* হালকা ব্লার ইফেক্ট (বেশি না) */
  z-index: -1;
}

html.dark-mode .bg-animation-container::before {
  background-image: url('https://i.pinimg.com/736x/1c/79/8b/1c798b11252ff958e405dc6fa6e9a39a.jpg'); /* Laptop Dark Mode */
}

.mesh-grid {
  position: absolute;
  top: 0;
  left: 0;
  width: 200%;
  height: 200%;
  background-image:
    linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);
  background-size: 95px 95px;
  animation: meshMove 30s linear infinite;
  opacity: .6;
}

@keyframes meshMove {
  0% { transform: translate(0,0); }
  100% { transform: translate(-50%,-50%); }
}

.visualizer-container {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 35%;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  padding: 0 5%;
  opacity: .4;
}

.visualizer-bar {
  width: 3px;
  background: linear-gradient(to top,var(--accent),var(--accent-secondary));
  border-radius: 3px 3px 0 0;
  animation: visualize 1.2s ease-in-out infinite;
  transform-origin: bottom;
}

.visualizer-bar:nth-child(odd) { height: 45%; animation-delay: .2s; }
.visualizer-bar:nth-child(even) { height: 65%; animation-delay: .5s; }

@keyframes visualize {
  0%,100% { transform: scaleY(.3); opacity: .3; }
  50% { transform: scaleY(1); opacity: .8; }
}

.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(75px);
  animation: ambientPulse 10s ease-in-out infinite;
}

.ambient-orb:nth-child(1) {
  width: 395px;
  height: 395px;
  top: -10%;
  left: -5%;
  background: radial-gradient(circle,rgba(0,212,255,.15),transparent 70%);
}

.ambient-orb:nth-child(2) {
  width: 345px;
  height: 345px;
  bottom: -10%;
  right: -5%;
  background: radial-gradient(circle,rgba(123,92,255,.12),transparent 70%);
  animation-delay: 3s;
}

@keyframes ambientPulse {
  0%,100% { transform: scale(1); opacity: .4; }
  50% { transform: scale(1.2); opacity: .7; }
}

.main-content {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 76px 20px 32px;
  animation: mainEntrance .8s ease-out both;
}

@keyframes mainEntrance {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.title-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 12px 30px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px var(--glass-shadow);
}

.page-title {
  font-family: 'Orbitron',sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-primary);
  background: linear-gradient(135deg,var(--accent),var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
}

/* Hamburger Menu & Dropdown Styling */
.hamburger-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
}

.hamburger-icon {
  width: 32px;
  height: 24px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--glass-bg);
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid var(--glass-border);
  box-shadow: 0 4px 12px var(--glass-shadow);
  backdrop-filter: blur(10px);
}

.line {
  display: block;
  width: 100%;
  height: 3px;
  background: var(--text-primary);
  border-radius: 2px;
  opacity: 0;
}

/* Entrance Animations */
.line-1 { animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.1s; }
.line-2 { animation: slideRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.2s; }
.line-3 { animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.3s; }

@keyframes slideDown { from { transform: translateY(-15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes slideRight { from { transform: translateX(-15px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.menu-dropdown {
  position: absolute;
  top: 45px;
  right: 0;
  width: 220px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  box-shadow: 0 8px 24px var(--glass-shadow);
  backdrop-filter: blur(15px);
  padding: 16px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: all 0.3s ease;
  z-index: 1001;
}

.menu-dropdown.active {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.menu-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.menu-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.toggle-group {
  display: flex;
  background: var(--copy-bg);
  border-radius: 8px;
  padding: 4px;
  border: 1px solid var(--glass-border);
}

.toggle-btn {
  flex: 1;
  padding: 8px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.toggle-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
  color: #fff;
  box-shadow: 0 2px 8px var(--accent-glow);
}

.menu-divider {
  height: 1px;
  background: var(--glass-border);
  margin: 16px 0;
}

/* Our Some Website - Logo Links */
.website-links {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
}

.website-link {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: var(--bg-secondary);
  box-shadow: 0 3px 10px var(--glass-shadow);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.website-link img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transform: scale(1.08);
  transition: transform 0.3s ease;
}

.website-link:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 14px var(--accent-glow);
}

.website-link:hover img {
  transform: scale(1.22);
}

.website-link:active {
  transform: scale(0.94);
}


/* Language Selector */
.language-selector { width: 100%; max-width: 600px; margin-bottom: 15px; }
.lang-options { display: flex; gap: 8px; padding: 8px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 12px; }
.lang-btn { flex: 1; padding: 10px; border: 1px solid var(--glass-border); border-radius: 8px; background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all .3s ease; }
.lang-btn.active { background: linear-gradient(135deg,var(--accent),var(--accent-secondary)); border-color: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }

/* Text Area */
.text-display-container {
  width: 100%;
  max-width: 760px;
  min-height: 300px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px var(--glass-shadow);
  padding: 20px;
  position: relative;
  transition: all .3s ease;
}

.text-display {
  width: 100%;
  min-height: 250px;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: var(--font-family);
  font-size: 1.3rem;
  line-height: 1.8;
  color: var(--text-primary);
  overflow-y: auto;
  max-height: 50vh;
}

.text-display.editable { background: rgba(0,212,255,.05); border-radius: 8px; padding: 10px; }
.text-display::-webkit-scrollbar { width: 6px; }
.text-display::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* Typing Animation */
.typing-circle-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); display: none; pointer-events: none; }
.typing-circle-container.active { display: block; }
.typing-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--accent); animation: spin 1s linear infinite; position: relative; }
.typing-circle::before { content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: rgba(0,212,255,.5); animation: spin .8s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Microphone */
.mic-container { margin-top: 25px; display: flex; flex-direction: column; align-items: center; }
.mic-btn { width: 70px; height: 70px; border-radius: 50%; border: none; background: linear-gradient(135deg,var(--accent),var(--accent-secondary)); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .3s ease; box-shadow: 0 4px 20px var(--mic-glow); }
.mic-btn:active { transform: scale(.95); }
.mic-btn.listening { animation: micPulse 1.5s ease-in-out infinite; background: linear-gradient(135deg,#ff4b64,#ff7b8a); box-shadow: 0 4px 20px rgba(255,75,100,.6); }
@keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,75,100,.6); } 50% { box-shadow: 0 0 0 15px rgba(255,75,100,0); } }
.mic-status { margin-top: 10px; font-size: .9rem; color: var(--text-secondary); font-weight: 600; }
.mic-status.active { color: #ff4b64; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .5; } }

/* Action Buttons */
.action-buttons { display: flex; gap: 10px; margin-top: 20px; justify-content: center; width: 100%; max-width: 600px; flex-wrap: wrap; }
.action-btn { display: flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 8px; border: 1px solid; background: transparent; font-family: inherit; font-size: .95rem; font-weight: 600; cursor: pointer; transition: all .3s ease; }
.edit-btn { border-color: var(--copy-border); color: var(--accent); }
.edit-btn:hover, .edit-btn.active { background: var(--copy-bg); transform: translateY(-2px); }

/* মাইক্রোফোন চাপলে Save বাটন লাল হবে */
.edit-btn.mic-warning {
  background: #ff4b64 !important;
  color: #ffffff !important;
  border-color: #ff4b64 !important;
  box-shadow: 0 0 14px rgba(255, 75, 100, 0.65);
}

.copy-btn { border-color: var(--copy-border); color: var(--accent); }
.copy-btn:hover { background: var(--copy-bg); transform: translateY(-2px); }
.clear-btn { border-color: var(--clear-border); color: var(--clear-color); }
.clear-btn:hover { background: var(--clear-bg); transform: translateY(-2px); }

/* Undo Button */
.undo-btn-container {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 50;
  margin-top: 0;
}
.undo-btn {
  display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--accent); background: var(--copy-bg); color: var(--accent); cursor: pointer; transition: all .3s ease; opacity: 0; visibility: hidden; transform: translateY(5px);
}
.undo-btn.show { opacity: 1; visibility: visible; transform: translateY(0); }
.undo-btn:hover { background: var(--accent); color: #fff; }

/* Toast - পারফেক্ট সাইজ এবং এলাইনমেন্ট */
.toast {
  position: fixed;
  top: 24px;
  left: 24px;
  transform: translateX(-150%);
  background: #ffffff;
  color: #111111;
  padding: 12px 18px;
  border-radius: 12px;
  border: 1px solid rgba(0,0,0,0.08);
  border-left: 4px solid var(--accent);
  font-size: 0.9rem;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  z-index: 9999;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
  width: max-content; /* যতটুকু লেখা, বক্স ততটুকুই হবে */
  max-width: 85vw;
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.3;
}

.toast::before {
  content: "“";
  font-size: 1.8rem;
  font-family: 'Georgia', serif;
  color: var(--accent);
  line-height: 1;
  margin-top: -2px;
}

.toast::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 24px;
  width: 12px;
  height: 12px;
  background: #ffffff;
  border-left: 1px solid rgba(0,0,0,0.08);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  transform: rotate(45deg);
  z-index: -1;
}

.toast.show { transform: translateX(0); }

html.dark-mode .toast {
  background: #0a1628;
  color: #e8f4ff;
  border-color: rgba(150,190,230,0.28);
  border-left-color: var(--accent);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

html.dark-mode .toast::after {
  background: #0a1628;
  border-left-color: rgba(150,190,230,0.28);
  border-bottom-color: rgba(150,190,230,0.28);
}

/* Mobile Layout */
@media (max-width: 768px) {
  .visualizer-container, .mesh-grid, .ambient-orb { display: none; }
  .main-content { padding: 68px 12px 40px; }
  .title-container { padding: 9px 16px; margin-bottom: 12px; }
  .page-title { font-size: 1.2rem; }
  .language-selector { margin-bottom: 12px; }
  .lang-options { padding: 6px; gap: 6px; }
  .lang-btn { padding: 10px 8px; }

  /* টেক্সট বক্স এবং বাটন মার্জিং */
  .text-display-container {
    min-height: 250px;
    padding: 12px;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    margin-bottom: 0;
    border-bottom: none; /* নিচের বর্ডার সরানো হলো যাতে বাটনের সাথে মিশে যায় */
    /* ফোনের লাইট মোডের ওয়ালপেপার */
  .bg-animation-container::before {
    background-image: url('https://i.pinimg.com/736x/5a/a2/c9/5aa2c9c5d23bd281d4ebc13883837a39.jpg');
  }

  /* ফোনের ডার্ক মোডের ওয়ালপেপার */
  html.dark-mode .bg-animation-container::before {
    background-image: url('https://i.pinimg.com/736x/2c/00/b7/2c00b7253769df3db279df1289f358a7.jpg');
  }
      
  }

  .text-display { font-size: 1.08rem; min-height: 190px; max-height: 42vh; }

  .action-buttons {
    position: relative;
    width: 100%;
    max-width: 760px;
    justify-content: space-between;
    margin-top: 0; /* একদম মিশে থাকার জন্য */
    gap: 7px;
    background: #fff;
    padding: 12px 9px 14px;
    border: 2px solid #111;
    border-top: 1px solid #e0e0e0; /* শুধু একটি হালকা লাইন */
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }

  .action-btn { padding: 9px 7px; font-size: .82rem; flex: 1; justify-content: center; color: #111; border-color: #111; min-width: 0; }
  .btn-text { display: inline; }
  .btn-icon { font-size: 1.05rem; }

  /* মাইক্রোফোন বাটন ঠিক নিচে */
  .mic-container {
    position: relative;
    margin-top: 15px; /* অ্যাকশন বাটনের একদম সাথে লেগে থাকবে */
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
  }

  .mic-btn { width: 58px; height: 58px; }
  .mic-status { margin-top: 4px; font-size: .78rem; color: #111; white-space: nowrap; }
  .mic-status.active { color: #c91f3d; }

  .undo-btn { width: 36px; height: 36px; border-radius: 50%; }

  html.dark-mode .action-buttons {
    background: #0a1628;
    border-color: rgba(150,190,230,0.28);
    border-top-color: rgba(150,190,230,0.15);
  }
  html.dark-mode .action-btn { color: #e8f4ff; border-color: rgba(150,190,230,0.28); }
  html.dark-mode .mic-status { color: #e8f4ff; }
}

@media (min-width: 769px) {
  .btn-text { display: inline; }
  .main-content { padding-bottom: 36px; }
}
</style>
</head>

<body>
<div class="bg-animation-container">
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
  <div class="mesh-grid"></div>
  <div class="visualizer-container">
    <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>

<script>
let isListening = false;
let isEditMode = false;
let recognition = null;
let selectedLang = 'bn-BD'; // মাইক্রোফোনের ভাষা (ডিফল্ট বাংলা)
let currentUILang = 'en';   // ওয়েবসাইটের UI ভাষা (ডিফল্ট ইংরেজি)
let restartTimeout = null;
let baseTranscript = '';
let interimTranscript = '';
let deletedText = '';
let stopRequested = false;
let runToken = 0;
let toastTimeout;

// UI Translation Dictionary
const uiText = {
  en: {
    title: "Voice to Text",
    edit: "Edit",
    save: "Save",
    copy: "Copy",
    clear: "Clear",
    micIdle: "Press mic to speak",
    micListening: "Listening... speak now",
    themeLabel: "Theme",
    uiLangLabel: "UI Language",
    toastEditOn: "Edit mode is on",
    toastEditOff: "Changes saved",
    toastCopied: "Text copied",
    toastCopyFail: "Copy failed—select text and copy manually",
    toastCleared: "All text cleared",
    toastRestored: "Text restored",
    toastNoText: "Nothing to copy",
    toastNothingToClear: "Nothing to clear",
    toastNoSupport: "Your browser does not support voice recognition. Try Chrome.",
    toastMicDenied: "Please allow microphone permission.",
    toastMicNotFound: "Microphone not found.",
    toastNetwork: "Network error—check your connection.",
    websitesLabel: "Our Some Website",

    
  },
  bn: {
    title: "Voice to Text",
    edit: "এডিট করুন",
    save: "সেভ করুন",
    copy: "কপি করুন",
    clear: "মুছে ফেলুন",
    micIdle: "মাইক চাপুন এবং কথা বলুন",
    micListening: "শুনছি... কথা বলুন",
    themeLabel: "থিম",
    uiLangLabel: "ইউআই ভাষা",
    toastEditOn: "এডিট মোড চালু আছে",
    toastEditOff: "পরিবর্তন সেভ হয়েছে",
    toastCopied: "টেক্সট কপি হয়েছে",
    toastCopyFail: "কপি করা যায়নি—টেক্সট সিলেক্ট করে কপি করুন",
    toastCleared: "সব টেক্সট মুছে ফেলা হয়েছে",
    toastRestored: "টেক্সট পুনরুদ্ধার করা হয়েছে",
    toastNoText: "কপি করার মতো কিছু নেই",
    toastNothingToClear: "মুছে ফেলার মতো কিছু নেই",
    toastNoSupport: "আপনার ব্রাউজার ভয়েস রিকগনিশন সাপোর্ট করে না। Chrome-এ চেষ্টা করুন।",
    toastMicDenied: "মাইক্রোফোন ব্যবহারের অনুমতি দিন।",
    toastMicNotFound: "মাইক্রোফোন পাওয়া যাচ্ছে না।",
    toastNetwork: "নেটওয়ার্ক সমস্যা—সংযোগ পরীক্ষা করুন।",
    websitesLabel: "আমাদের কিছু ওয়েবসাইট",
  }
};

const micBtn = document.getElementById('micBtn');
const micStatus = document.getElementById('ui-mic-status');
const textDisplay = document.getElementById('textDisplay');
const typingCircle = document.getElementById('typingCircle');
const toast = document.getElementById('toast');
const editBtn = document.getElementById('editBtn');
const editBtnText = document.getElementById('ui-edit');
const undoBtn = document.getElementById('undoBtn');
const menuDropdown = document.getElementById('menuDropdown');

// Menu Toggle
function toggleMenu() {
  menuDropdown.classList.toggle('active');
}

// Close menu when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.hamburger-container')) {
    menuDropdown.classList.remove('active');
  }
});

// Theme Setter
function setTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.classList.add('dark-mode');
    document.getElementById('btnDark').classList.add('active');
    document.getElementById('btnLight').classList.remove('active');
  } else {
    document.documentElement.classList.remove('dark-mode');
    document.getElementById('btnLight').classList.add('active');
    document.getElementById('btnDark').classList.remove('active');
  }
  toggleMenu();
}

// UI Language Setter
function setUILang(lang) {
  currentUILang = lang;
  if (lang === 'bn') {
    document.getElementById('btnUIBn').classList.add('active');
    document.getElementById('btnUIEn').classList.remove('active');
  } else {
    document.getElementById('btnUIEn').classList.add('active');
    document.getElementById('btnUIBn').classList.remove('active');
  }
  updateUI();
  toggleMenu();
}

// Update all UI text based on currentUILang
function updateUI() {
  const t = uiText[currentUILang];
  document.getElementById('ui-title').textContent = t.title;
  document.getElementById('ui-edit').textContent = isEditMode ? t.save : t.edit;
  document.getElementById('ui-copy').textContent = t.copy;
  document.getElementById('ui-clear').textContent = t.clear;
  document.getElementById('ui-theme-label').textContent = t.themeLabel;
  document.getElementById('ui-lang-label').textContent = t.uiLangLabel;
    document.getElementById('ui-websites-label').textContent = t.websitesLabel;
  
  if (isListening) {
    micStatus.textContent = t.micListening;
  } else {
    micStatus.textContent = t.micIdle;
  }
}

// Speech Language Selector (Top Buttons) - ONLY affects mic and placeholder
function selectLanguage(btn) {
  if (btn.dataset.lang === selectedLang) return;
  document.querySelectorAll('.lang-btn').forEach(button => button.classList.remove('active'));
  btn.classList.add('active');
  selectedLang = btn.dataset.lang;
  
  textDisplay.placeholder = selectedLang === 'bn-BD' 
    ? 'মাইক চাপুন এবং কথা বলা শুরু করুন...' 
    : 'Press the mic and start speaking...';

  if (isListening) {
    stopListening();
    window.setTimeout(startListening, 250);
  }
}

function renderTranscript() {
  const parts = [baseTranscript.trimEnd(), interimTranscript.trim()].filter(Boolean);
  textDisplay.value = parts.join(parts.length > 1 ? ' ' : '');
  textDisplay.scrollTop = textDisplay.scrollHeight;
}

let lastFinalChunk = '';
let lastFinalChunkAt = 0;

function normalizeTranscriptChunk(text) {
  return String(text || '').replace(/\s+/g, ' ').trim().toLocaleLowerCase().replace(/[.!?,;:।！？،؛]+$/u, '');
}

function appendFinalTranscript(text) {
  const clean = String(text || '').replace(/\s+/g, ' ').trim();
  if (!clean) return;
  const normalized = normalizeTranscriptChunk(clean);
  const now = Date.now();
  if (normalized && normalized === lastFinalChunk && now - lastFinalChunkAt < 3000) {
    interimTranscript = '';
    renderTranscript();
    return;
  }
  lastFinalChunk = normalized;
  lastFinalChunkAt = now;
  baseTranscript = baseTranscript.trimEnd() ? baseTranscript.trimEnd() + ' ' + clean : clean;
  interimTranscript = '';
  renderTranscript();
}

function createRecognition(token) {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showToast('toastNoSupport');
    isListening = false;
    updateMicUI(false);
    return;
  }

  const recog = new SpeechRecognition();
  const finalizedIndexes = new Set();
  const isMobileDevice =
    /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  recog.lang = selectedLang;

  // মোবাইলে একটি করে speech segment শনাক্ত হবে।
  // ডেস্কটপে আগের continuous recognition-ই থাকবে।
  recog.continuous = !isMobileDevice;
  recog.interimResults = !isMobileDevice;
  recog.maxAlternatives = 1;

  recog.onstart = () => {
    if (token !== runToken || !isListening) return;

    recognition = recog;
    updateMicUI(true);
  };

  recog.onresult = event => {
    if (token !== runToken || !isListening || isEditMode) return;

    const interimParts = [];
    const startIndex = Number.isInteger(event.resultIndex)
      ? event.resultIndex
      : 0;

    for (let i = startIndex; i < event.results.length; i++) {
      const result = event.results[i];

      if (!result || !result[0]) continue;

      const transcript = result[0].transcript.trim();

      if (!transcript) continue;

      if (result.isFinal) {
        if (!finalizedIndexes.has(i)) {
          finalizedIndexes.add(i);
          appendFinalTranscript(transcript);
        }
      } else {
        interimParts.push(transcript);
      }
    }

    interimTranscript = interimParts.join(' ').trim();
    renderTranscript();
  };

  recog.onerror = event => {
    if (token !== runToken) return;

    if (
      event.error === 'not-allowed' ||
      event.error === 'service-not-allowed'
    ) {
      showToast('toastMicDenied');
      stopListening();
    } else if (event.error === 'audio-capture') {
      showToast('toastMicNotFound');
    } else if (event.error === 'network') {
      showToast('toastNetwork');
    }
  };

  recog.onend = () => {
    if (recognition === recog) recognition = null;

    if (token !== runToken || !isListening || stopRequested) return;

    interimTranscript = '';
    renderTranscript();

    if (restartTimeout) clearTimeout(restartTimeout);

    restartTimeout = window.setTimeout(() => {
      if (token === runToken && isListening && !stopRequested) {
        createRecognition(token);
      }
    }, isMobileDevice ? 300 : 180);
  };

  try {
    recog.start();
  } catch (error) {
    if (token === runToken && isListening) {
      if (restartTimeout) clearTimeout(restartTimeout);

      restartTimeout = window.setTimeout(() => {
        if (token === runToken && isListening && !stopRequested) {
          createRecognition(token);
        }
      }, isMobileDevice ? 500 : 350);
    }
  }
}

function updateMicUI(active) {
  micBtn.classList.toggle('listening', active);
  micStatus.classList.toggle('active', active);
  typingCircle.classList.toggle('active', active);
  const t = uiText[currentUILang];
  micStatus.textContent = active ? t.micListening : t.micIdle;
}


function toggleListening() {
  // Edit Mode চালু থাকলে মাইক চালু হবে না
  if (isEditMode) {
    const t = uiText[currentUILang];

    // এডিট করা লেখা সেভ করো
    isEditMode = false;
    baseTranscript = textDisplay.value.trim();
    interimTranscript = '';

    // Text Box আবার Read-only করো
    textDisplay.setAttribute('readonly', true);
    textDisplay.classList.remove('editable');

    // Edit বাটনকে আবার Edit অবস্থায় ফিরিয়ে আনো
    editBtn.classList.remove('active');
    editBtnText.textContent = t.edit;


    // সেভ করা লেখা ঠিক রাখো
    renderTranscript();

    // আগের মেসেজ সিস্টেমে সেভ হওয়ার মেসেজ দেখাও
    showToast('toastEditOff');

    // Edit বাটন লাল করো এবং কাঁপাও
    editBtn.classList.add('mic-warning');
    shakeEditButton();


    // অ্যানিমেশন শেষে লাল রং সরিয়ে দাও
    window.setTimeout(() => {
      editBtn.classList.remove('mic-warning');
    }, 650);

    // এই ক্লিকে মাইক চালু হবে না
    return;
  }

  // Edit Mode বন্ধ থাকলে মাইক্রোফোন স্বাভাবিকভাবে কাজ করবে
  if (isListening) stopListening();
  else startListening();
}


function startListening() {
  if (isListening) return;
  stopRequested = false;
  isListening = true;
  runToken++;
  interimTranscript = '';
  lastFinalChunk = '';
  lastFinalChunkAt = 0;
  updateMicUI(true);
  createRecognition(runToken);
}

function stopListening() {
  stopRequested = true;
  isListening = false;
  runToken++;
  if (restartTimeout) { clearTimeout(restartTimeout); restartTimeout = null; }
  const oldRecognition = recognition;
  recognition = null;
  if (oldRecognition) {
    oldRecognition.onresult = null;
    oldRecognition.onend = null;
    try { oldRecognition.stop(); } catch (_) {}
  }
  interimTranscript = '';
  renderTranscript();
  updateMicUI(false);
}

function toggleEditMode() {
  isEditMode = !isEditMode;
  const t = uiText[currentUILang];
  if (isEditMode) {
    if (isListening) stopListening();
    textDisplay.removeAttribute('readonly');
    textDisplay.classList.add('editable');
    editBtn.classList.add('active');
    editBtnText.textContent = t.save;
    showToast('toastEditOn');
    textDisplay.focus();
  } else {
    textDisplay.setAttribute('readonly', true);
    textDisplay.classList.remove('editable');
    editBtn.classList.remove('active');
    editBtnText.textContent = t.edit;
    baseTranscript = textDisplay.value.trim();
    interimTranscript = '';
    renderTranscript();
    showToast('toastEditOff');
  }
}

function copyText() {
  const text = textDisplay.value.trim();
  if (!text) { showToast('toastNoText'); return; }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast('toastCopied')).catch(() => fallbackCopy());
  } else { fallbackCopy(); }
  function fallbackCopy() {
    textDisplay.removeAttribute('readonly');
    textDisplay.select();
    try { document.execCommand('copy'); showToast('toastCopied'); } catch (_) { showToast('toastCopyFail'); }
    if (!isEditMode) textDisplay.setAttribute('readonly', true);
    textDisplay.setSelectionRange(textDisplay.value.length, textDisplay.value.length);
  }
}

function clearText() {
  if (!textDisplay.value.trim()) { showToast('toastNothingToClear'); return; }
  deletedText = textDisplay.value;
  baseTranscript = '';
  interimTranscript = '';
  textDisplay.value = '';
  undoBtn.classList.add('show');
  showToast('toastCleared');
}

function undoClear() {
  if (!deletedText) return;
  baseTranscript = deletedText.trim();
  interimTranscript = '';
  renderTranscript();
  undoBtn.classList.remove('show');
  deletedText = '';
  showToast('toastRestored');
}

function showToast(messageKey) {
  if (toastTimeout) clearTimeout(toastTimeout);
  toast.classList.remove('show');
  void toast.offsetWidth; 
  
  const t = uiText[currentUILang];
  const finalMessage = t[messageKey] || messageKey;
  
  toast.textContent = finalMessage;
  toast.classList.add('show');
  toastTimeout = window.setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

function shakeEditButton() {
  editBtn.classList.remove('shake-edit');
  void editBtn.offsetWidth;
  editBtn.classList.add('shake-edit');
  window.setTimeout(() => editBtn.classList.remove('shake-edit'), 650);
}





document.addEventListener('contextmenu', event => {
  // টেক্সট বক্সের ভেতরে রাইট-ক্লিক করলে
  // ব্রাউজার মেনু বন্ধ হবে এবং Edit বাটন কাঁপবে
  if (event.target === textDisplay) {
    event.preventDefault();
    event.stopPropagation();

    if (!isEditMode) {
      shakeEditButton();
    }

    return;
  }

  // টেক্সট বক্সের বাইরে রাইট-ক্লিক মেনু বন্ধ থাকবে
  event.preventDefault();
  event.stopPropagation();
}, true);




let longPressTimer = null;
let longPressTriggered = false;
textDisplay.addEventListener('touchstart', () => {
  if (isEditMode) return;
  longPressTriggered = false;
  longPressTimer = window.setTimeout(() => {
    longPressTriggered = true;
    shakeEditButton();
  }, 500);
}, { passive: true });

['touchend', 'touchmove', 'touchcancel'].forEach(type => {
  textDisplay.addEventListener(type, () => {
    if (longPressTimer) clearTimeout(longPressTimer);
    longPressTimer = null;
  }, { passive: true });
});

textDisplay.addEventListener('selectstart', event => {
  if (!isEditMode) event.preventDefault();
});

const shakeStyle = document.createElement('style');
shakeStyle.textContent = `
@keyframes editButtonShake {
  0%,100% { transform: translateX(0); }
  15%,45%,75% { transform: translateX(-5px); }
  30%,60%,90% { transform: translateX(5px); }
}
.edit-btn.shake-edit { animation: editButtonShake .55s ease-in-out; }
`;

document.addEventListener('keydown', event => {
  const key = event.key.toLowerCase();

  // Attempt to block common browser inspection shortcuts
  const blockedShortcut =
    (event.ctrlKey && !event.shiftKey && key === 'u') ||
    (event.ctrlKey && event.shiftKey &&
      ['i', 'j', 'c'].includes(key)) ||
    (key === 'f12');

  if (blockedShortcut) {
    event.preventDefault();
    event.stopPropagation();
    return;
  }

  // Preserve the existing microphone shortcut
  if (event.code === 'Space' && event.ctrlKey) {
    event.preventDefault();
    toggleListening();
  }
});

// Initialize UI on load
updateUI();

</script>
</body>
