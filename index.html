<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voice to Text - ভয়েস টাইপিং</title>
<link rel="icon" type="image/jpg" href="https://i.pinimg.com/736x/70/1a/f4/701af4536876f6acf9d9bc853921db87.jpg">
<link rel="apple-touch-icon" href="https://i.pinimg.com/736x/70/1a/f4/701af4536876f6acf9d9bc853921db87.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Orbitron:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #050a15;
  --bg-secondary: #0a1628;
  --text-primary: #e8f4ff;
  --text-secondary: #7a9ec7;
  --glass-bg: rgba(15, 35, 70, 0.65);
  --glass-border: rgba(100, 180, 255, 0.15);
  --glass-shadow: rgba(0, 0, 0, 0.5);
  --accent: #00d4ff;
  --accent-secondary: #7b5cff;
  --accent-glow: rgba(0, 212, 255, 0.35);
  --mic-color: #00d4ff;
  --mic-glow: rgba(0, 212, 255, 0.5);
  --copy-bg: rgba(0, 212, 255, 0.15);
  --copy-border: rgba(0, 212, 255, 0.35);
  --clear-bg: rgba(255, 75, 100, 0.15);
  --clear-border: rgba(255, 75, 100, 0.4);
  --clear-color: #ff4b64;
  --font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
  --transition-speed: 0.4s;
}

html.light-mode {
  --bg-primary: #e8f4ff;
  --bg-secondary: #d0e8ff;
  --text-primary: #0a1628;
  --text-secondary: #3a5a8a;
  --glass-bg: rgba(255, 255, 255, 0.75);
  --glass-border: rgba(0, 150, 200, 0.2);
  --glass-shadow: rgba(0, 50, 100, 0.1);
  --mic-glow: rgba(0, 150, 255, 0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--font-family);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background var(--transition-speed), color var(--transition-speed);
  position: relative;
}

/* Background Animation */
.bg-animation-container {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none;
  background: radial-gradient(ellipse 80% 50% at 20% 40%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
              radial-gradient(ellipse 60% 40% at 80% 60%, rgba(123, 92, 255, 0.06) 0%, transparent 50%),
              linear-gradient(180deg, #050a15 0%, #0a1628 50%, #0d1f3c 100%);
}
html.light-mode .bg-animation-container {
  background: radial-gradient(ellipse 80% 50% at 20% 40%, rgba(0, 180, 255, 0.08) 0%, transparent 50%),
              linear-gradient(180deg, #e8f4ff 0%, #d0e8ff 50%, #c0d8f0 100%);
}

.mesh-grid {
  position: absolute; top: 0; left: 0; width: 200%; height: 200%;
  background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
  background-size: 95px 95px; animation: meshMove 30s linear infinite; opacity: 0.6;
}
@keyframes meshMove { 0% { transform: translate(0, 0); } 100% { transform: translate(-50%, -50%); } }

.visualizer-container {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 35%; display: flex;
  justify-content: space-around; align-items: flex-end; padding: 0 5%; opacity: 0.4;
}
.visualizer-bar {
  width: 3px; background: linear-gradient(to top, var(--accent), var(--accent-secondary));
  border-radius: 3px 3px 0 0; animation: visualize 1.2s ease-in-out infinite; transform-origin: bottom;
}
.visualizer-bar:nth-child(odd) { height: 45%; animation-delay: 0.2s; }
.visualizer-bar:nth-child(even) { height: 65%; animation-delay: 0.5s; }
@keyframes visualize { 0%, 100% { transform: scaleY(0.3); opacity: 0.3; } 50% { transform: scaleY(1); opacity: 0.8; } }

.ambient-orb {
  position: absolute; border-radius: 50%; filter: blur(75px); animation: ambientPulse 10s ease-in-out infinite;
}
.ambient-orb:nth-child(1) { width: 395px; height: 395px; top: -10%; left: -5%; background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent 70%); }
.ambient-orb:nth-child(2) { width: 345px; height: 345px; bottom: -10%; right: -5%; background: radial-gradient(circle, rgba(123, 92, 255, 0.12), transparent 70%); animation-delay: 3s; }
@keyframes ambientPulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.2); opacity: 0.7; } }

/* Main Content */
.main-content {
  position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start; padding: 80px 20px 40px;
  animation: mainEntrance 0.8s ease-out both;
}
@keyframes mainEntrance { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.title-container {
  display: flex; align-items: center; justify-content: center; gap: 15px;
  background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
  border-radius: 12px; padding: 12px 30px; margin-bottom: 20px;
  box-shadow: 0 4px 20px var(--glass-shadow);
}
.page-title {
  font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--text-primary);
  background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;
}

/* Theme Toggle (BB-8) - Scaled down for better fit */
.theme-toggle-container {
  position: fixed; top: 15px; right: 15px; z-index: 1000; transform: scale(0.55); transform-origin: right top;
}
.bb8-toggle { --toggle-size: 16px; --toggle-width: 10.625em; --toggle-height: 5.625em; --toggle-offset: calc((var(--toggle-height) - 4.375em) / 2); --toggle-bg: linear-gradient(#2c4770, #070e2b 35%, #628cac 50% 70%, #a6c5d4) no-repeat; --radius: 99em; --transition: 0.4s; --accent: #de7d2f; --bb8-bg: #fff; cursor: pointer; }
.bb8-toggle__checkbox { display: none; }
.bb8-toggle__container { width: var(--toggle-width); height: var(--toggle-height); background: var(--toggle-bg); background-size: 100% 11.25em; background-position-y: -5.625em; border-radius: var(--radius); position: relative; transition: var(--transition); }
.bb8 { display: flex; flex-direction: column; align-items: center; position: absolute; top: calc(var(--toggle-offset) - 1.5em); left: var(--toggle-offset); transition: var(--transition); z-index: 2; }
.bb8__head-container { position: relative; transition: var(--transition); transform-origin: 1.25em 3.75em; }
.bb8__head { overflow: hidden; margin-bottom: -0.188em; width: 2.5em; height: 1.688em; background: linear-gradient(transparent 0.063em, dimgray 0.063em 0.313em, transparent 0.313em 0.375em, var(--accent) 0.375em 0.5em, transparent 0.5em 1.313em, silver 1.313em 1.438em, transparent 1.438em), linear-gradient(45deg, transparent 0.188em, var(--bb8-bg) 0.188em 1.25em, transparent 1.25em), linear-gradient(-45deg, transparent 0.188em, var(--bb8-bg) 0.188em 1.25em, transparent 1.25em), linear-gradient(var(--bb8-bg) 1.25em, transparent 1.25em); border-radius: var(--radius) var(--radius) 0 0; position: relative; filter: drop-shadow(0 0.063em 0.125em gray); }
.bb8__head::before { content: ""; position: absolute; width: 0.563em; height: 0.563em; background: radial-gradient(0.125em circle at 0.25em 0.375em, red, transparent), radial-gradient(0.063em circle at 0.375em 0.188em, var(--bb8-bg) 50%, transparent 100%), linear-gradient(45deg, #000 0.188em, dimgray 0.313em 0.375em, #000 0.5em); border-radius: var(--radius); top: 0.413em; left: 50%; transform: translate(-50%); box-shadow: 0 0 0 0.089em lightgray, 0.563em 0.281em 0 -0.148em, 0.563em 0.281em 0 -0.1em var(--bb8-bg); transition: var(--transition); }
.bb8__antenna { position: absolute; transform: translateY(-90%); width: 0.059em; border-radius: var(--radius) var(--radius) 0 0; transition: var(--transition); }
.bb8__antenna:nth-child(1) { height: 0.938em; right: 0.938em; background: linear-gradient(#000 0.188em, silver 0.188em); }
.bb8__antenna:nth-child(2) { height: 0.375em; left: 50%; transform: translate(-50%, -90%); background: silver; }
.bb8__body { width: 4.375em; height: 4.375em; background: var(--bb8-bg); border-radius: var(--radius); position: relative; overflow: hidden; transition: var(--transition); transform: rotate(45deg); background: linear-gradient(-90deg, var(--bb8-bg) 4%, var(--accent) 4% 10%, transparent 10% 90%, var(--accent) 90% 96%, var(--bb8-bg) 96%), linear-gradient(var(--bb8-bg) 4%, var(--accent) 4% 10%, transparent 10% 90%, var(--accent) 90% 96%, var(--bb8-bg) 96%); }
.bb8-toggle__checkbox:checked + .bb8-toggle__container { background-position-y: 0; }
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8 { left: calc(100% - 4.375em - var(--toggle-offset)); }
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8__body { transform: rotate(225deg); }
.bb8-toggle__checkbox:active + .bb8-toggle__container .bb8__head-container { transform: rotate(25deg); }
.bb8-toggle__checkbox:checked:active + .bb8-toggle__container .bb8__head-container { transform: rotate(-25deg); }

/* Language Selector */
.language-selector { width: 100%; max-width: 600px; margin-bottom: 15px; }
.lang-options { display: flex; gap: 8px; padding: 8px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 12px; }
.lang-btn { flex: 1; padding: 10px; border: 1px solid var(--glass-border); border-radius: 8px; background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
.lang-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); border-color: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }

/* Text Display */
.text-display-container {
  width: 100%; max-width: 600px; min-height: 300px; background: var(--glass-bg);
  backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px;
  box-shadow: 0 8px 32px var(--glass-shadow); padding: 20px; position: relative; transition: all 0.3s ease;
}
.text-display {
  width: 100%; min-height: 250px; background: transparent; border: none; outline: none; resize: none;
  font-family: var(--font-family); font-size: 1.3rem; line-height: 1.8; color: var(--text-primary);
  overflow-y: auto; max-height: 50vh;
}
.text-display.editable { background: rgba(0, 212, 255, 0.05); border-radius: 8px; padding: 10px; }
.text-display::-webkit-scrollbar { width: 6px; }
.text-display::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* Typing Circle */
.typing-circle-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
.typing-circle-container.active { display: block; }
.typing-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--accent); animation: spin 1s linear infinite; position: relative; }
.typing-circle::before { content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: rgba(0, 212, 255, 0.5); animation: spin 0.8s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Mic Button */
.mic-container { margin-top: 25px; display: flex; flex-direction: column; align-items: center; }
.mic-btn {
  width: 70px; height: 70px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
  color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; box-shadow: 0 4px 20px var(--mic-glow);
}
.mic-btn:active { transform: scale(0.95); }
.mic-btn.listening { animation: micPulse 1.5s ease-in-out infinite; background: linear-gradient(135deg, #ff4b64, #ff7b8a); box-shadow: 0 4px 20px rgba(255, 75, 100, 0.6); }
@keyframes micPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 75, 100, 0.6); } 50% { box-shadow: 0 0 0 15px rgba(255, 75, 100, 0); } }
.mic-status { margin-top: 10px; font-size: 0.9rem; color: var(--text-secondary); font-weight: 600; }
.mic-status.active { color: #ff4b64; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }

/* Action Buttons */
.action-buttons { display: flex; gap: 10px; margin-top: 20px; justify-content: center; width: 100%; max-width: 600px; flex-wrap: wrap; }
.action-btn {
  display: flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 8px;
  border: 1px solid; background: transparent; font-family: inherit; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; transition: all 0.3s ease;
}
.edit-btn { border-color: var(--copy-border); color: var(--accent); }
.edit-btn:hover, .edit-btn.active { background: var(--copy-bg); transform: translateY(-2px); }
.copy-btn { border-color: var(--copy-border); color: var(--accent); }
.copy-btn:hover { background: var(--copy-bg); transform: translateY(-2px); }
.clear-btn { border-color: var(--clear-border); color: var(--clear-color); }
.clear-btn:hover { background: var(--clear-bg); transform: translateY(-2px); }

.undo-btn {
  display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
  border-radius: 8px; border: 1px solid var(--accent); background: var(--copy-bg);
  color: var(--accent); cursor: pointer; transition: all 0.3s ease; opacity: 0; visibility: hidden;
  transform: translateY(5px); margin-top: 10px;
}
.undo-btn.show { opacity: 1; visibility: visible; transform: translateY(0); }
.undo-btn:hover { background: var(--accent); color: #fff; }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
  color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
  box-shadow: 0 4px 20px var(--accent-glow); z-index: 9999; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ================= MOBILE OPTIMIZATION ================= */
@media (max-width: 768px) {
  /* Performance: Disable heavy animations on mobile to save battery and prevent lag */
  .visualizer-container, .mesh-grid { display: none; }
  .ambient-orb { filter: blur(40px); opacity: 0.3; }
  
  .main-content { padding: 70px 15px 160px; } /* Extra bottom padding for fixed controls */
  
  .title-container { padding: 10px 20px; margin-bottom: 15px; }
  .page-title { font-size: 1.3rem; }
  
  .text-display-container { min-height: 250px; padding: 15px; }
  .text-display { font-size: 1.15rem; min-height: 200px; }
  
  /* Fixed bottom controls for easy thumb access on mobile */
  .action-buttons {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    width: 92%; max-width: 450px; justify-content: space-between; z-index: 99; margin-top: 0; gap: 8px;
    background: rgba(5, 10, 21, 0.8); backdrop-filter: blur(10px); padding: 10px; border-radius: 16px;
    border: 1px solid var(--glass-border);
  }
  html.light-mode .action-buttons { background: rgba(255, 255, 255, 0.8); }
  
  .action-btn { padding: 12px 8px; font-size: 0.85rem; flex: 1; justify-content: center; }
  .btn-text { display: none; } /* Show only icons on small screens for cleaner look */
  .btn-icon { font-size: 1.4rem; }
  
  .mic-container {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
    background: rgba(10, 22, 40, 0.85); backdrop-filter: blur(12px);
    padding: 10px 30px; border-radius: 40px; border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }
  html.light-mode .mic-container { background: rgba(255, 255, 255, 0.85); }
  
  .mic-btn { width: 60px; height: 60px; }
  .mic-status { margin-top: 5px; font-size: 0.8rem; }
  
  .undo-btn-container {
    position: fixed; bottom: 105px; right: 4%; z-index: 99; margin-top: 0; width: auto;
  }
  .undo-btn { width: 40px; height: 40px; border-radius: 50%; }
}

@media (min-width: 769px) {
  .btn-text { display: inline; }
}
</style>
</head>
<body>

<div class="bg-animation-container">
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
  <div class="mesh-grid"></div>
  <div class="visualizer-container">
    <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
    <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
    <div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div>
  </div>
</div>

<!-- Theme Toggle -->
<div class="theme-toggle-container">
  <label class="bb8-toggle">
    <input class="bb8-toggle__checkbox" type="checkbox" id="themeToggle">
    <div class="bb8-toggle__container">
      <div class="bb8">
        <div class="bb8__head-container">
          <div class="bb8__antenna"></div>
          <div class="bb8__antenna"></div>
          <div class="bb8__head"></div>
        </div>
        <div class="bb8__body"></div>
      </div>
    </div>
  </label>
</div>

<!-- Main Content -->
<div class="main-content">
  <div class="title-container">
    <h1 class="page-title">Voice to Text</h1>
  </div>
  
  <div class="language-selector">
    <div class="lang-options">
      <button class="lang-btn active" data-lang="bn-BD" onclick="selectLanguage(this)">বাংলা</button>
      <button class="lang-btn" data-lang="en-US" onclick="selectLanguage(this)">English</button>
    </div>
  </div>

  <div class="text-display-container">
    <div class="typing-circle-container" id="typingCircle">
      <div class="typing-circle"></div>
    </div>
    <textarea class="text-display" id="textDisplay" placeholder="মাইক চাপুন এবং কথা বলুন শুরু করুন..." readonly></textarea>
  </div>

  <div class="mic-container">
    <button class="mic-btn" id="micBtn" onclick="toggleListening()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <span class="mic-status" id="micStatus">মাইক চাপুন এবং কথা বলুন</span>
  </div>

  <div class="action-buttons">
    <button class="action-btn edit-btn" id="editBtn" onclick="toggleEditMode()">
      <span class="btn-icon">✏️</span>
      <span class="btn-text" id="editBtnText">এডিট করুন</span>
    </button>
    <button class="action-btn copy-btn" onclick="copyText()">
      <span class="btn-icon">📋</span>
      <span class="btn-text">কপি করুন</span>
    </button>
    <button class="action-btn clear-btn" onclick="clearText()">
      <span class="btn-icon">🗑️</span>
      <span class="btn-text">মুছে ফেলুন</span>
    </button>
  </div>
  
  <div class="undo-btn-container">
    <button class="undo-btn" id="undoBtn" onclick="undoClear()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// State
let isListening = false;
let isEditMode = false;
let recognition = null;
let selectedLang = 'bn-BD';
let restartTimeout = null;

// Robust transcript storage to prevent mobile duplication bug
let baseTranscript = '';
let currentSessionFinal = '';
let deletedText = '';

// Elements
const micBtn = document.getElementById('micBtn');
const micStatus = document.getElementById('micStatus');
const textDisplay = document.getElementById('textDisplay');
const typingCircle = document.getElementById('typingCircle');
const toast = document.getElementById('toast');
const themeToggle = document.getElementById('themeToggle');
const editBtn = document.getElementById('editBtn');
const editBtnText = document.getElementById('editBtnText');
const undoBtn = document.getElementById('undoBtn');

// Language Selection
function selectLanguage(btn) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedLang = btn.dataset.lang;
  
  if (recognition) {
    recognition.lang = selectedLang;
  }
  
  const placeholders = {
    'bn-BD': 'মাইক চাপুন এবং কথা বলুন শুরু করুন...',
    'en-US': 'Press the mic and start speaking...'
  };
  textDisplay.placeholder = placeholders[selectedLang];
  
  const statusText = {
    'bn-BD': 'মাইক চাপুন এবং কথা বলুন',
    'en-US': 'Press mic to speak'
  };
  if (!isListening) {
    micStatus.textContent = statusText[selectedLang];
  }
  
  if (isListening) {
    stopListening();
    setTimeout(() => startListening(), 600);
  }
}

// Speech Recognition Setup
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('❌ আপনার ব্রাউজার ভয়েস রিকগনিশন সাপোর্ট করে না।');
    return null;
  }
  
  const recog = new SpeechRecognition();
  recog.lang = selectedLang;
  recog.continuous = true;
  recog.interimResults = true;
  recog.maxAlternatives = 1;
  
  recog.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    micStatus.textContent = selectedLang === 'bn-BD' ? 'শুনছি... (কথা বলুন)' : 'Listening...';
    micStatus.classList.add('active');
    typingCircle.classList.add('active');
  };
  
  recog.onresult = (event) => {
    let sessionFinal = '';
    let interim = '';
    
    // Rebuild from index 0 to get the absolute truth of the current session
    for (let i = 0; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        sessionFinal += transcript + ' ';
      } else {
        interim += transcript;
      }
    }
    
    currentSessionFinal = sessionFinal;
    
    // Construct display text safely
    let displayText = baseTranscript;
    if (currentSessionFinal) {
      displayText += currentSessionFinal;
    }
    if (interim) {
      displayText += (displayText && !displayText.endsWith(' ') ? ' ' : '') + interim;
    }
    
    textDisplay.value = displayText.trim();
    textDisplay.scrollTop = textDisplay.scrollHeight;
  };
  
  recog.onerror = (event) => {
    console.error('Speech error:', event.error);
    if (event.error === 'not-allowed') {
      showToast('❌ মাইক্রোফোন অ্যাক্সেস দেওয়া হয়নি।');
      stopListening();
    } else if (event.error === 'no-speech') {
      // Ignore no-speech, let it restart
    } else {
      showToast('⚠️ সমস্যা: ' + event.error);
    }
  };
  
  recog.onend = () => {
    if (isListening) {
      // CRITICAL: Bake the session final into base before restarting to prevent duplication
      if (currentSessionFinal) {
        baseTranscript += currentSessionFinal;
        currentSessionFinal = '';
      }
      
      if (restartTimeout) clearTimeout(restartTimeout);
      // 500ms delay is the magic number to prevent Android Chrome echo/repetition bug
      restartTimeout = setTimeout(() => {
        if (isListening) {
          try {
            recognition.start();
          } catch (e) {
            console.log("Restart prevented:", e);
          }
        }
      }, 500);
    }
  };
  
  return recog;
}

function toggleListening() {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  recognition = initSpeechRecognition();
  if (recognition) {
    try {
      recognition.start();
    } catch(e) {
      showToast('⚠️ ভয়েস রিকগনিশন শুরু করা যায়নি');
    }
  }
}

function stopListening() {
  isListening = false;
  if (restartTimeout) {
    clearTimeout(restartTimeout);
    restartTimeout = null;
  }
  if (recognition) {
    recognition.stop();
    recognition = null;
  }
  
  // Bake any remaining final text
  if (currentSessionFinal) {
    baseTranscript += currentSessionFinal;
    currentSessionFinal = '';
  }
  
  // If not in edit mode, ensure display matches base
  if (!isEditMode) {
    textDisplay.value = baseTranscript.trim();
  }
  
  micBtn.classList.remove('listening');
  const statusText = { 'bn-BD': 'মাইক চাপুন এবং কথা বলুন', 'en-US': 'Press mic to speak' };
  micStatus.textContent = statusText[selectedLang];
  micStatus.classList.remove('active');
  typingCircle.classList.remove('active');
}

// Toggle Edit Mode
function toggleEditMode() {
  isEditMode = !isEditMode;
  if (isEditMode) {
    textDisplay.removeAttribute('readonly');
    textDisplay.classList.add('editable');
    editBtn.classList.add('active');
    editBtnText.textContent = 'সেভ করুন';
    showToast('✏️ এডিট মোড চালু আছে');
    textDisplay.focus();
  } else {
    textDisplay.setAttribute('readonly', true);
    textDisplay.classList.remove('editable');
    editBtn.classList.remove('active');
    editBtnText.textContent = 'এডিট করুন';
    // CRITICAL: Sync edited text back to baseTranscript so future voice appends correctly
    const editedText = textDisplay.value.trim();
    baseTranscript = editedText ? editedText + ' ' : '';
    showToast('✅ পরিবর্তন সেভ হয়েছে');
  }
}

// Copy Text
function copyText() {
  const text = textDisplay.value.trim();
  if (!text) {
    showToast('⚠️ কপি করার মতো কিছু নেই');
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ টেক্সট কপি হয়েছে!');
  }).catch(() => {
    textDisplay.select();
    document.execCommand('copy');
    showToast('✅ টেক্সট কপি হয়েছে!');
  });
}

// Clear Text
function clearText() {
  const textToClear = textDisplay.value.trim();
  if (!textToClear) {
    showToast('⚠️ মুছে ফেলার মতো কিছু নেই');
    return;
  }
  deletedText = textToClear;
  baseTranscript = '';
  currentSessionFinal = '';
  textDisplay.value = '';
  undoBtn.classList.add('show');
  showToast('🗑️ সব টেক্সট মুছে ফেলা হয়েছে');
  
  const container = document.querySelector('.text-display-container');
  container.style.transform = 'scale(0.98)';
  container.style.opacity = '0.7';
  setTimeout(() => {
    container.style.transform = 'scale(1)';
    container.style.opacity = '1';
  }, 300);
}

// Undo Clear
function undoClear() {
  if (deletedText) {
    textDisplay.value = deletedText;
    baseTranscript = deletedText + (deletedText && !deletedText.endsWith(' ') ? ' ' : '');
    showToast('✅ টেক্সট পুনরুদ্ধার করা হয়েছে');
    undoBtn.classList.remove('show');
    deletedText = '';
  }
}

// Show Toast
function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Theme Toggle
themeToggle.addEventListener('change', function() {
  if (this.checked) {
    document.documentElement.classList.add('light-mode');
  } else {
    document.documentElement.classList.remove('light-mode');
  }
});

// Keyboard shortcut (Ctrl + Space)
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.ctrlKey) {
    e.preventDefault();
    toggleListening();
  }
});
</script>
</body>
